<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>識字小幫手</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 React 與 ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- 引入 Babel 讓瀏覽器可以直接編譯 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 載入中文字體與自訂動畫 -->
  <link href="https://fonts.googleapis.com/earlyaccess/cwtexkai.css" rel="stylesheet">
  <style>
    .font-biaukai { font-family: 'cwTeXKai', 'BiauKai', '標楷體', 'Kaiti TC', serif; }
    @keyframes wiggle { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    .animate-wiggle { animation: wiggle 0.5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-sky-50">
  <div id="root"></div>

  <!-- 應用程式邏輯 (設定 data-type="module" 以支援 Firebase import) -->
  <script type="text/babel" data-type="module">
    // 從全域變數取得 React Hooks
    const { useState, useEffect, useCallback, useRef } = React;
    
    // 從 CDN 引入 Firebase 模組
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    // 預設從照片中整理出來的 30 個單字
    const DEFAULT_WORDS = [
      "冰箱", "杯子", "布丁", "手帕", "蘋果",
      "葡萄", "馬",  "螞蟻", "蜜蜂", "米飯",
      "飛機", "房屋", "帆船", "風車", "蛋糕",
      "蝴蝶", "電話", "兔子", "糖果", "牛奶",
      "鳥",  "駱駝", "唱歌", "狗",  "筷子",
      "可樂", "卡車", "猴子", "金魚", "剪刀"
    ];

    const initFirebase = () => {
      try {
        const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        if (Object.keys(config).length > 0) {
          const app = initializeApp(config);
          return { auth: getAuth(app), db: getFirestore(app), appId };
        }
        return { auth: null, db: null, appId };
      } catch (error) {
        console.error('Firebase init error', error);
        return { auth: null, db: null, appId: 'default-app-id' };
      }
    };

    const { auth, db, appId } = initFirebase();

    // 安全的 LocalStorage 存取
    const safeGetStorage = (key) => {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    };
    const safeSetStorage = (key, val) => {
      try { localStorage.setItem(key, val); } catch (e) { console.warn('Storage blocked'); }
    };
    const safeRemoveStorage = (key) => {
      try { localStorage.removeItem(key); } catch (e) { /* ignore */ }
    };

    // 家庭代碼格式驗證
    const isValidFamilyCode = (code) => /^[a-zA-Z0-9\u4e00-\u9fff_-]{1,20}$/.test(code.trim());

    // 移除 export default，直接宣告元件
    function App() {
      const [user, setUser] = useState(null);
      const [familyCode, setFamilyCode] = useState('');
      const [inputCode, setInputCode] = useState('');
      const [syncStatus, setSyncStatus] = useState('local');

      const [generalWords, setGeneralWords] = useState([]);
      const [learningWords, setLearningWords] = useState([]);
      const [currentWord, setCurrentWord] = useState('');
      const [view, setView] = useState('game');

      const [gameStatus, setGameStatus] = useState('idle');
      const [newWord, setNewWord] = useState('');
      const [transcript, setTranscript] = useState('');
      const [selectedLearning, setSelectedLearning] = useState([]);
      const [selectedGeneral, setSelectedGeneral] = useState([]);
      const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, message: '', action: null });
      const [alertMessage, setAlertMessage] = useState('');

      const recognitionRef = useRef(null);
      const currentWordRef = useRef(currentWord);
      
      useEffect(() => { currentWordRef.current = currentWord; }, [currentWord]);

      const wordPoolRef = useRef({ general: [], learning: [] });
      useEffect(() => {
        wordPoolRef.current = { general: generalWords, learning: learningWords };
      }, [generalWords, learningWords]);

      // --- 身份驗證 ---
      useEffect(() => {
        if (!auth) return;
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.error('Auth Error', err);
          }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      // --- 初始化本地資料 ---
      useEffect(() => {
        const savedGeneral = safeGetStorage('kidsWords_general');
        const savedLearning = safeGetStorage('kidsWords_learning');
        const savedCode = safeGetStorage('kidsWords_familyCode');

        if (savedGeneral || savedLearning) {
          setGeneralWords(savedGeneral ? JSON.parse(savedGeneral) : []);
          setLearningWords(savedLearning ? JSON.parse(savedLearning) : []);
        } else {
          setGeneralWords(DEFAULT_WORDS);
          setLearningWords([]);
        }
        if (savedCode) {
          setFamilyCode(savedCode);
          setInputCode(savedCode);
        }
      }, []);

      // --- 監聽雲端資料變化 ---
      useEffect(() => {
        if (!db || !user || !familyCode) {
          setSyncStatus('local');
          return;
        }
        setSyncStatus('connecting');
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'families', familyCode);
        const unsubscribe = onSnapshot(
          docRef,
          (snap) => {
            if (snap.exists()) {
              const data = snap.data();
              setGeneralWords(data.generalWords || []);
              setLearningWords(data.learningWords || []);
              safeSetStorage('kidsWords_general', JSON.stringify(data.generalWords || []));
              safeSetStorage('kidsWords_learning', JSON.stringify(data.learningWords || []));
              setSyncStatus('synced');
            }
          },
          (err) => {
            console.error('Sync Error', err);
            setSyncStatus('local');
          }
        );
        return () => unsubscribe();
      }, [user, familyCode]);

      const saveData = useCallback(async (general, learning, currentCode = familyCode) => {
        safeSetStorage('kidsWords_general', JSON.stringify(general));
        safeSetStorage('kidsWords_learning', JSON.stringify(learning));
        if (db && user && currentCode) {
          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'families', currentCode);
            await setDoc(docRef, {
              generalWords: general,
              learningWords: learning,
              updatedAt: Date.now(),
            });
          } catch (err) {
            console.error('Save to cloud failed', err);
          }
        }
      }, [user, familyCode]);

      const pickRandomWord = useCallback(() => {
        const { general, learning } = wordPoolRef.current;
        const total = general.length + learning.length;
        if (total === 0) return;

        setCurrentWord((prev) => {
          const poolL = learning.filter((w) => w !== prev);
          const poolG = general.filter((w) => w !== prev);
          let targetArray;
          if (poolL.length > 0 && poolG.length > 0) {
            targetArray = Math.random() < 0.7 ? poolL : poolG;
          } else if (poolL.length > 0) {
            targetArray = poolL;
          } else if (poolG.length > 0) {
            targetArray = poolG;
          } else {
            return prev;
          }
          return targetArray[Math.floor(Math.random() * targetArray.length)];
        });

        setGameStatus('idle');
        setTranscript('');
      }, []);

      useEffect(() => {
        const total = generalWords.length + learningWords.length;
        if (total > 0 && !currentWord && view === 'game') {
          pickRandomWord();
        }
      }, [generalWords, learningWords, currentWord, view, pickRandomWord]);

      const speak = useCallback((text, callback, fromAnswer = false) => {
        if (!('speechSynthesis' in window)) {
          if (callback) setTimeout(callback, 1000);
          return;
        }
        if (!fromAnswer) setGameStatus('playing');
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 0.9;
        utterance.pitch = 1.1;

        let callbackFired = false;
        let timeoutId;

        const finish = () => {
          if (!callbackFired) {
            callbackFired = true;
            clearTimeout(timeoutId);
            if (!fromAnswer) setGameStatus('idle');
            if (callback) setTimeout(callback, 400);
          }
        };

        utterance.onend = finish;
        utterance.onerror = finish;
        window.speechSynthesis.speak(utterance);
        timeoutId = setTimeout(finish, Math.max(3000, text.length * 500 + 500));
      }, []);

      const checkAnswer = (spokenText) => {
        const cleanSpoken = spokenText.replace(/[。，？！.,?!]/g, '').trim();
        setTranscript(cleanSpoken);
        const word = currentWordRef.current;
        if (cleanSpoken.includes(word)) {
          setGameStatus('correct');
          speak(`答對了！${word}`, pickRandomWord, true);
        } else {
          setGameStatus('wrong');
          speak(`答錯了，這是${word}`, pickRandomWord, true);
        }
      };

      const handleViewChange = () => {
        if (recognitionRef.current) {
          recognitionRef.current.abort();
          recognitionRef.current = null;
        }
        window.speechSynthesis.cancel();
        setGameStatus('idle');

        if (view === 'admin') {
          setView('game');
          if (!currentWord) pickRandomWord();
        } else {
          setView('admin');
        }
      };

      const startListening = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          setAlertMessage('很抱歉，您的瀏覽器不支援語音辨識功能。建議使用 Google Chrome 瀏覽器。');
          return;
        }
        if (recognitionRef.current) recognitionRef.current.stop();
        window.speechSynthesis.cancel();

        const recognition = new SpeechRecognition();
        recognitionRef.current = recognition;
        recognition.lang = 'zh-TW';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
          setGameStatus('listening');
          setTranscript('');
        };
        recognition.onresult = (e) => checkAnswer(e.results[0][0].transcript);
        recognition.onerror = (e) => {
          setGameStatus('idle');
          if (e.error === 'no-speech') speak('沒聽到聲音喔');
        };
        recognition.onend = () => {
          setGameStatus((prev) => (prev === 'listening' ? 'idle' : prev));
        };
        try { recognition.start(); } catch (e) { setGameStatus('idle'); }
      };

      const connectToCloud = async () => {
        if (!db || !user || !inputCode.trim()) return;
        if (!isValidFamilyCode(inputCode)) {
          setAlertMessage('家庭代碼只能包含中英文、數字、底線或橫線，且不超過 20 個字。');
          return;
        }
        const code = inputCode.trim();
        setSyncStatus('connecting');
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'families', code);
          const snap = await getDoc(docRef);
          if (snap.exists()) {
            const data = snap.data();
            setGeneralWords(data.generalWords || []);
            setLearningWords(data.learningWords || []);
            safeSetStorage('kidsWords_general', JSON.stringify(data.generalWords || []));
            safeSetStorage('kidsWords_learning', JSON.stringify(data.learningWords || []));
          } else {
            await setDoc(docRef, { generalWords, learningWords, updatedAt: Date.now() });
          }
          setFamilyCode(code);
          safeSetStorage('kidsWords_familyCode', code);
        } catch (err) {
          console.error(err);
          setSyncStatus('local');
          setAlertMessage('無法連線到雲端伺服器，請稍後再試。');
        }
      };

      const disconnectCloud = () => {
        setFamilyCode('');
        setInputCode('');
        safeRemoveStorage('kidsWords_familyCode');
        setSyncStatus('local');
      };

      const openConfirm = (message, action) => setConfirmDialog({ isOpen: true, message, action });
      const closeConfirm = () => setConfirmDialog({ isOpen: false, message: '', action: null });

      const addWord = () => {
        const trimmed = newWord.trim();
        if (!trimmed) return;
        if (generalWords.includes(trimmed) || learningWords.includes(trimmed)) {
          setAlertMessage(`「${trimmed}」已經在字庫裡面囉！`);
          return;
        }
        const newLearningList = [trimmed, ...learningWords];
        setLearningWords(newLearningList);
        saveData(generalWords, newLearningList);
        setNewWord('');
      };

      const deleteWord = (wordToDelete, isLearning) => {
        openConfirm(`確定要刪除「${wordToDelete}」嗎？`, () => {
          if (isLearning) {
            const updated = learningWords.filter((w) => w !== wordToDelete);
            setLearningWords(updated);
            saveData(generalWords, updated);
            setSelectedLearning((prev) => prev.filter((w) => w !== wordToDelete));
          } else {
            const updated = generalWords.filter((w) => w !== wordToDelete);
            setGeneralWords(updated);
            saveData(updated, learningWords);
            setSelectedGeneral((prev) => prev.filter((w) => w !== wordToDelete));
          }
          if (currentWordRef.current === wordToDelete) setCurrentWord('');
          closeConfirm();
        });
      };

      const toggleSelect = (word, isLearning) => {
        if (isLearning) {
          setSelectedLearning((prev) => prev.includes(word) ? prev.filter((w) => w !== word) : [...prev, word]);
        } else {
          setSelectedGeneral((prev) => prev.includes(word) ? prev.filter((w) => w !== word) : [...prev, word]);
        }
      };

      const moveLearningToGeneral = () => {
        if (selectedLearning.length === 0) return;
        const newLearning = learningWords.filter((w) => !selectedLearning.includes(w));
        const newGeneral = [...selectedLearning, ...generalWords];
        setLearningWords(newLearning);
        setGeneralWords(newGeneral);
        saveData(newGeneral, newLearning);
        setSelectedLearning([]);
      };

      const moveGeneralToLearning = () => {
        if (selectedGeneral.length === 0) return;
        const newGeneral = generalWords.filter((w) => !selectedGeneral.includes(w));
        const newLearning = [...selectedGeneral, ...learningWords];
        setGeneralWords(newGeneral);
        setLearningWords(newLearning);
        saveData(newGeneral, newLearning);
        setSelectedGeneral([]);
      };

      const resetToDefault = () => {
        openConfirm('確定要恢復成預設單字庫嗎？所有自訂單字都會消失喔！', () => {
          setGeneralWords(DEFAULT_WORDS);
          setLearningWords([]);
          saveData(DEFAULT_WORDS, []);
          setSelectedGeneral([]);
          setSelectedLearning([]);
          closeConfirm();
        });
      };

      const isListening  = gameStatus === 'listening';
      const isDisabled   = gameStatus !== 'idle';
      const isPlayingAudio = gameStatus === 'playing' || gameStatus === 'correct' || gameStatus === 'wrong';
      const feedback = gameStatus === 'correct' ? 'correct' : gameStatus === 'wrong' ? 'wrong' : null;
      const totalWordsCount = generalWords.length + learningWords.length;

      return (
        <div className="min-h-screen font-sans text-gray-800 flex flex-col relative overflow-hidden">
          {alertMessage && (
            <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl text-center">
                <p className="text-xl font-bold text-gray-800 mb-6">{alertMessage}</p>
                <button
                  onClick={() => setAlertMessage('')}
                  className="w-full py-3 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-xl transition shadow-md"
                >我知道了</button>
              </div>
            </div>
          )}

          {confirmDialog.isOpen && (
            <div className="fixed inset-0 bg-black/50 z-[50] flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl">
                <h3 className="text-xl sm:text-2xl font-bold text-gray-800 mb-6 text-center">{confirmDialog.message}</h3>
                <div className="flex gap-4">
                  <button onClick={closeConfirm} className="flex-1 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-xl transition">取消</button>
                  <button onClick={confirmDialog.action} className="flex-1 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl transition shadow-md">確定</button>
                </div>
              </div>
            </div>
          )}

          <header className="bg-white shadow-sm p-4 flex justify-between items-center rounded-b-3xl z-10 relative">
            <h1 className="text-xl sm:text-2xl font-bold text-sky-600 flex items-center gap-2">🌟 識字小幫手</h1>
            <button onClick={handleViewChange} className="bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 sm:px-5 sm:py-2.5 rounded-full font-bold transition shadow-md flex items-center gap-2 text-sm sm:text-base">
              {view === 'game' ? '⚙️ 家長設定' : '🎮 返回遊戲'}
            </button>
          </header>

          <main className="flex-1 flex flex-col items-center justify-center p-4 relative z-0">
            {view === 'game' && (
              <div className="w-full max-w-2xl flex flex-col items-center">
                {totalWordsCount === 0 ? (
                  <div className="bg-white p-8 rounded-3xl shadow-xl text-center">
                    <h2 className="text-2xl sm:text-3xl font-bold mb-4 text-gray-700">單字庫空空的耶！</h2>
                    <p className="text-lg sm:text-xl text-gray-500 mb-6">請爸爸媽媽到「家長設定」加入一些國字吧。</p>
                  </div>
                ) : (
                  <>
                    <div className={`relative bg-white w-full aspect-[4/3] sm:aspect-auto sm:h-80 rounded-[3rem] shadow-2xl flex flex-col items-center justify-center mb-8 transition-transform transform ${feedback === 'correct' ? 'scale-105 ring-8 ring-green-400' : feedback === 'wrong' ? 'ring-8 ring-red-400' : ''}`}>
                      <div className="absolute top-4 right-4 px-3 py-1 rounded-full text-sm font-bold opacity-50 border border-gray-200">
                        {learningWords.includes(currentWord) ? '🔥 加強練習' : '📚 一般字'}
                      </div>
                      <button onClick={() => speak(currentWord, null)} className="absolute top-4 left-4 p-3 bg-sky-100 text-sky-600 rounded-full hover:bg-sky-200 transition text-2xl">🔊</button>
                      <span className="font-biaukai text-[100px] sm:text-[140px] text-slate-800 tracking-widest mt-4">{currentWord}</span>
                      <div className="h-16 mt-2 flex items-center justify-center px-4 text-center">
                        {feedback === 'correct' && <span className="text-2xl sm:text-4xl text-green-500 font-bold animate-bounce">🎉 答對了！</span>}
                        {feedback === 'wrong' && <span className="text-xl sm:text-3xl text-red-500 font-bold">💡 答錯了，這是「<span className="font-biaukai">{currentWord}</span>」</span>}
                        {isListening && <span className="text-xl sm:text-3xl text-sky-500 font-bold animate-pulse">👂 聽你說...</span>}
                      </div>
                    </div>
                    <div className="flex items-center gap-4 sm:gap-6 mb-4">
                      <button onClick={startListening} disabled={isDisabled} className={`relative group flex items-center justify-center w-28 h-28 sm:w-36 sm:h-36 rounded-full shadow-xl transition-all ${isDisabled ? 'bg-gray-300 scale-100 cursor-not-allowed' : 'bg-yellow-400 hover:bg-yellow-300 hover:scale-105 hover:-translate-y-2 active:scale-95 cursor-pointer'}`}>
                        {isListening && <span className="absolute inset-0 rounded-full border-4 border-red-400 animate-ping opacity-75" />}
                        <span className={`text-5xl sm:text-7xl ${!isDisabled ? 'group-hover:animate-wiggle' : ''}`}>🎤</span>
                      </button>
                      <button onClick={pickRandomWord} disabled={isListening} className="flex flex-col items-center justify-center w-20 h-20 sm:w-24 sm:h-24 bg-white rounded-full shadow-lg hover:bg-gray-50 active:scale-95 transition-all">
                        <span className="text-2xl sm:text-4xl">⏭️</span>
                        <span className="text-xs sm:text-sm font-bold text-gray-500 mt-1">下一題</span>
                      </button>
                    </div>
                    <p className="text-lg sm:text-xl text-gray-600 font-bold bg-white/50 px-6 py-2 rounded-full">{isPlayingAudio ? '聽聽看...' : '按麥克風唸出來！'}</p>
                    {transcript && <p className="mt-4 text-gray-500 font-medium">你說：「<span className="text-sky-600 font-biaukai text-2xl sm:text-3xl">{transcript}</span>」</p>}
                  </>
                )}
              </div>
            )}

            {view === 'admin' && (
              <div className="w-full max-w-4xl bg-white p-4 sm:p-8 rounded-3xl shadow-xl flex flex-col gap-6">
                <div className="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 sm:p-5">
                  <h3 className="text-base sm:text-lg font-bold text-indigo-800 flex items-center gap-2 mb-2">☁️ 跨裝置雲端同步</h3>
                  <p className="text-xs sm:text-sm text-indigo-600 mb-4">想在平板上共用字庫嗎？請自訂「家庭代碼」，並在另一台設備上輸入相同代碼即可。</p>
                  <div className="flex flex-col sm:flex-row gap-3">
                    <input type="text" value={inputCode} onChange={(e) => setInputCode(e.target.value)} placeholder="英數中文，最多 20 字" disabled={familyCode !== ''} className="flex-1 p-3 border-2 border-indigo-200 rounded-xl focus:outline-none focus:border-indigo-400 disabled:bg-gray-100 font-bold text-indigo-900" />
                    {familyCode === '' ? (
                      <button onClick={connectToCloud} disabled={!inputCode.trim() || syncStatus === 'connecting'} className="bg-indigo-500 hover:bg-indigo-600 disabled:bg-indigo-300 text-white font-bold px-6 py-3 rounded-xl transition flex-shrink-0 whitespace-nowrap">
                        {syncStatus === 'connecting' ? '連線中...' : '建立連線'}
                      </button>
                    ) : (
                      <button onClick={disconnectCloud} className="bg-gray-400 hover:bg-gray-500 text-white font-bold px-6 py-3 rounded-xl transition flex-shrink-0 whitespace-nowrap">斷開連線</button>
                    )}
                  </div>
                  {familyCode !== '' && (
                    <div className="mt-3 text-xs sm:text-sm font-bold flex items-center gap-2 text-green-600">
                      <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse" />目前已連線至：「{familyCode}」，會自動同步字庫。
                    </div>
                  )}
                </div>

                <div className="border-b pb-6 border-gray-100">
                  <div className="flex justify-between items-center mb-4">
                    <h2 className="text-lg sm:text-2xl font-bold text-sky-700 flex items-center gap-2">📚 分級管理 <span className="text-sm font-normal text-sky-500">(共 {totalWordsCount} 字)</span></h2>
                    <button onClick={resetToDefault} className="h-10 text-xs sm:text-sm bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1 rounded-xl font-bold transition whitespace-nowrap flex-shrink-0">🔄 恢復預設</button>
                  </div>
                  <div className="flex gap-2 sm:gap-4 w-full">
                    <input type="text" value={newWord} onChange={(e) => setNewWord(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addWord(); }} placeholder="輸入新國字..." className="font-biaukai flex-1 min-w-0 text-lg sm:text-2xl p-3 sm:p-4 border-2 border-amber-200 bg-amber-50 rounded-xl focus:outline-none focus:border-amber-400 transition placeholder:text-amber-300 placeholder:font-sans" />
                    <button onClick={addWord} disabled={!newWord.trim()} className="bg-green-500 hover:bg-green-600 disabled:bg-gray-300 text-white px-5 sm:px-8 py-3 sm:py-4 rounded-xl font-bold text-lg sm:text-xl transition whitespace-nowrap flex-shrink-0">➕ 新增</button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="bg-amber-50/50 border-2 border-amber-100 rounded-2xl p-4 flex flex-col h-[40vh] sm:h-[50vh]">
                    <div className="flex justify-between items-center mb-3 pb-2 border-b border-amber-200">
                      <h3 className="text-base sm:text-xl font-bold text-amber-700 flex items-center gap-2">🔥 較不熟區 ({learningWords.length})</h3>
                      <span className="text-xs font-bold text-amber-600 bg-amber-100 px-2 py-1 rounded">機率 70%</span>
                    </div>
                    <div className="flex-1 overflow-y-auto pr-2 space-y-2">
                      {learningWords.length === 0 ? <p className="text-center text-amber-400 py-10">無單字</p> : learningWords.map((word) => (
                        <label key={word} className="flex items-center bg-white p-3 rounded-xl border border-amber-100 cursor-pointer hover:border-amber-300 transition group">
                          <input type="checkbox" className="w-5 h-5 mr-3 accent-amber-500 flex-shrink-0" checked={selectedLearning.includes(word)} onChange={() => toggleSelect(word, true)} />
                          <span className="font-biaukai text-2xl font-bold text-gray-800 flex-1">{word}</span>
                          <button onClick={(e) => { e.preventDefault(); deleteWord(word, true); }} className="text-red-300 hover:text-red-500 sm:opacity-0 group-hover:opacity-100 transition px-2 text-xl" title="刪除">✖</button>
                        </label>
                      ))}
                    </div>
                    <button onClick={moveLearningToGeneral} disabled={selectedLearning.length === 0} className="mt-4 w-full bg-amber-400 hover:bg-amber-500 disabled:bg-amber-200 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl transition flex justify-center items-center gap-2 flex-shrink-0">轉移至一般國字 ➡</button>
                  </div>

                  <div className="bg-sky-50/50 border-2 border-sky-100 rounded-2xl p-4 flex flex-col h-[40vh] sm:h-[50vh]">
                    <div className="flex justify-between items-center mb-3 pb-2 border-b border-sky-200">
                      <h3 className="text-base sm:text-xl font-bold text-sky-700 flex items-center gap-2">📚 一般字區 ({generalWords.length})</h3>
                      <span className="text-xs font-bold text-sky-600 bg-sky-100 px-2 py-1 rounded">機率 30%</span>
                    </div>
                    <div className="flex-1 overflow-y-auto pr-2 space-y-2">
                      {generalWords.length === 0 ? <p className="text-center text-sky-400 py-10">無單字</p> : generalWords.map((word) => (
                        <label key={word} className="flex items-center bg-white p-3 rounded-xl border border-sky-100 cursor-pointer hover:border-sky-300 transition group">
                          <input type="checkbox" className="w-5 h-5 mr-3 accent-sky-500 flex-shrink-0" checked={selectedGeneral.includes(word)} onChange={() => toggleSelect(word, false)} />
                          <span className="font-biaukai text-2xl font-bold text-gray-800 flex-1">{word}</span>
                          <button onClick={(e) => { e.preventDefault(); deleteWord(word, false); }} className="text-red-300 hover:text-red-500 sm:opacity-0 group-hover:opacity-100 transition px-2 text-xl" title="刪除">✖</button>
                        </label>
                      ))}
                    </div>
                    <button onClick={moveGeneralToLearning} disabled={selectedGeneral.length === 0} className="mt-4 w-full bg-sky-400 hover:bg-sky-500 disabled:bg-sky-200 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl transition flex justify-center items-center gap-2 flex-shrink-0">⬅ 轉移回較不熟區</button>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    // 將 React 應用程式渲染到畫面上
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
